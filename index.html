<style>
  :root { --accent: #0f5b8c; --ink: #16212c; --ink-2: #4b5967; --line: #d3dae1; --bad: #b03030; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.5 Barlow, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: #0b1724;
    background-image: radial-gradient(900px 600px at 80% -10%, rgba(15,91,140,.55), transparent 60%),
                      radial-gradient(700px 500px at -10% 110%, rgba(15,91,140,.25), transparent 55%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
    width: min(410px, 100%); padding: 30px 28px 24px;
  }
  .brand h1 {
    margin: 0; font: 600 30px/1.1 "Barlow Condensed", sans-serif; letter-spacing: .01em;
  }
  .brand h1 .c { color: var(--accent); }
  .chip {
    display: inline-block; vertical-align: 4px; margin-left: 10px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent); color: #fff; font: 600 11px/1.5 "Barlow Condensed", sans-serif; letter-spacing: .1em;
    white-space: nowrap; text-transform: uppercase;
  }
  .sub { display: block; margin-top: 4px; color: var(--ink-2); font-size: 12.5px; letter-spacing: .14em; }
  form { margin-top: 24px; }
  label { display: block; font: 600 11.5px/1 Barlow, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font: 15px Barlow, sans-serif; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; background: #fff; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,91,140,.18); }
  button {
    margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff; font: 600 15px Barlow, sans-serif;
  }
  button:disabled { opacity: .6; cursor: default; }
  #gate-status { min-height: 22px; margin: 12px 0 0; font-size: 13.5px; color: var(--ink-2); }
  #gate-status.bad { color: var(--bad); }
  .foot { margin-top: 18px; color: rgba(255,255,255,.55); font-size: 12px; text-align: center; max-width: 410px; }
  .foot b { color: rgba(255,255,255,.75); font-weight: 600; }
</style>
</head>

  <div class="card">
    <div class="brand">
      <h1>TML <span class="c">Cost</span> Calculator<span class="chip" id="vchip">Beta V1.3</span></h1>
      <span class="sub">NEXALUME® · NEXIUM® · NEXCOLOR®</span>
    </div>
    <form id="gate-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="username" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="signin" type="submit">Sign in</button>
      <p id="gate-status" aria-live="polite"></p>
    </form>
  </div>

(function () {
  var form = document.getElementById('gate-form');
  var email = document.getElementById('email');
  var pass = document.getElementById('password');
  var btn = document.getElementById('signin');
  var status = document.getElementById('gate-status');
  var SS_KEY = 'tmlcalc.gate.k';

  function say(msg, bad) { status.textContent = msg; status.className = bad ? 'bad' : ''; }
  try { if (GATE.built) { var bd = new Date(GATE.built); document.getElementById('gbuild').textContent = 'Build ' + (isNaN(bd) ? GATE.built : bd.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + bd.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })) + ' (WIB may differ) — if a colleague sees an older build, reload with Cmd+Shift+R or Ctrl+F5.'; } } catch (e) {}

  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    say('This browser is too old for the encrypted beta. Use a current Chrome, Edge or Safari.', true);
    btn.disabled = true;
    return;
  }

  function b64d(s) {
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function b64e(buf) {
    var u = new Uint8Array(buf), s = '';
    for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return btoa(s);
  }
  function sha256hex(s) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (h) {
      return Array.prototype.map.call(new Uint8Array(h), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }
  function deriveKey(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', salt: b64d(GATE.salt), iterations: GATE.iter },
          km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }
  async function unlock(key) {
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(GATE.iv) }, key, b64d(GATE.ct));
    var stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
    var html = await new Response(stream).text();
    try { sessionStorage.setItem(SS_KEY, b64e(await crypto.subtle.exportKey('raw', key))); } catch (e) {}
    document.open();
    document.write(html);
    document.close();
  }

  // Auto-unlock if this tab already signed in (key cached for the tab session only).
  (function () {
    var k = null;
    try { k = sessionStorage.getItem(SS_KEY); } catch (e) {}
    if (!k) return;
    say('Unlocking…');
    crypto.subtle.importKey('raw', b64d(k), 'AES-GCM', true, ['decrypt'])
      .then(unlock)
      .catch(function () { try { sessionStorage.removeItem(SS_KEY); sessionStorage.removeItem('tmlcalc.gate.user'); } catch (e) {} say(''); });
  })();

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var em = (email.value || '').trim().toLowerCase();
    var pw = pass.value || '';
    if (!em || !pw) return;
    btn.disabled = true;
    say('Checking…');
    sha256hex(em).then(function (h) {
      var allowed = Array.isArray(GATE.users) ? GATE.users.indexOf(h) >= 0 : h === GATE.emailHash;
      if (!allowed) { throw { gate: 'email' }; }
      return deriveKey(pw);
    }).then(function (key) {
      try { sessionStorage.setItem('tmlcalc.gate.user', JSON.stringify({ email: em })); } catch (e) {}
      return unlock(key);
    }).catch(function (e) {
      btn.disabled = false;
      try { sessionStorage.removeItem('tmlcalc.gate.user'); } catch (x) {}
      if (e && e.gate === 'email') say('This email is not registered for the beta.', true);
      else say('Wrong password. Check caps lock and try again.', true);
    });
  });
})();
