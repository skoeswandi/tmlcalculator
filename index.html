<style>
  :root { --accent: #0062b1; --green: #8dc63f; --navy: #1b3f8c; --ink: #16212c; --ink-2: #4b5967; --line: #d3dae1; --bad: #b03030; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.5 Barlow, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: #0a1e3d;
    background-image: radial-gradient(900px 600px at 80% -10%, rgba(0,98,177,.6), transparent 60%),
                      radial-gradient(700px 500px at -10% 110%, rgba(141,198,63,.22), transparent 55%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
    width: min(410px, 100%); padding: 26px 28px 24px; overflow: hidden; position: relative;
  }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: linear-gradient(90deg, var(--accent) 0 62%, var(--green) 62% 100%); }
  .brand { text-align: center; }
  .brand .logo { display: block; height: 118px; width: auto; margin: 4px auto 10px; }
  .brand h1 {
    margin: 0; font: 600 28px/1.1 "Barlow Condensed", sans-serif; letter-spacing: .01em;
  }
  .plogos { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 12px; }
  .plogos img { height: 15px; width: auto; }
  .plogos img.nexium { height: 16px; }
  .brand h1 .c { color: var(--accent); }
  .chip {
    display: inline-block; vertical-align: 4px; margin-left: 10px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent); color: #fff; font: 600 11px/1.5 "Barlow Condensed", sans-serif; letter-spacing: .1em;
    white-space: nowrap; text-transform: uppercase;
  }
  .sub { display: block; margin-top: 2px; color: var(--ink-2); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; }
  form { margin-top: 24px; }
  label { display: block; font: 600 11.5px/1 Barlow, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font: 15px Barlow, sans-serif; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; background: #fff; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,98,177,.18); }
  button {
    margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff; font: 600 15px Barlow, sans-serif;
  }
  button:disabled { opacity: .6; cursor: default; }
  #gate-status { min-height: 22px; margin: 12px 0 0; font-size: 13.5px; color: var(--ink-2); }
  #gate-status.bad { color: var(--bad); }
  .foot { margin-top: 18px; color: rgba(255,255,255,.55); font-size: 12px; text-align: center; max-width: 410px; }
  .foot b { color: rgba(255,255,255,.75); font-weight: 600; }
  .links { margin: 12px 0 0; font-size: 13px; text-align: center; } .links a { color: var(--accent); }
</style>
</head>

<script>
/* Sign-in shell for the Supabase build (inlined into index.html by tools/sb-build.mjs).
   The page holds no calculator code and no data: after Supabase sign-in it downloads app.html from the
   private "app" bucket (readable only by active profiles) and writes it into the document. */
(function () {
  'use strict';
  var CFG = { url: 'https://iimhoziisbslllvkgmpj.supabase.co', anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpbWhvemlpc2JzbGxsdmtnbXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NzQ1NDAsImV4cCI6MjEwODU1MDU0MH0.PVrjIGed5ifmqiI2cmrrA3O2pWmWen9YGKcCXzSoEgk' };
  var $ = function (s) { return document.querySelector(s); };
  var form = $('#gate-form'), email = $('#email'), password = $('#password'), btn = $('#signin'), status = $('#gate-status');
  var npWrap = $('#np-wrap'), newpw = $('#newpw'), forgot = $('#forgot');
  var mode = 'signin';
  function say(msg, bad) { status.textContent = msg || ''; status.className = bad ? 'bad' : ''; }
  if (!window.supabase || !window.supabase.createClient) { say('The sign-in library did not load. Check the connection and reload.', true); return; }
  var sb = window.supabase.createClient(CFG.url, CFG.anon);

  async function loadApp() {
    say('Loading the calculator…');
    btn.disabled = true;
    var r = await sb.storage.from('app').download('app.html');
    if (r.error) {
      var m = /not found|404/i.test(r.error.message || '') ? 'The calculator has not been published yet.' : /row-level|policy|403|unauthori/i.test(r.error.message || '') ? 'This account is not active yet. Ask the administrator to enable it.' : 'Could not load the calculator: ' + r.error.message;
      say(m, true); btn.disabled = false;
      if (/not active/.test(m)) await sb.auth.signOut();
      return false;
    }
    var html = await r.data.text();
    window.__TML_SB = CFG;
    document.open(); document.write(html); document.close();
    return true;
  }
  function setMode(m) {
    mode = m;
    var recovery = m === 'recovery';
    npWrap.hidden = !recovery; password.closest('label') && (password.closest('label').hidden = recovery);
    password.hidden = recovery; password.required = !recovery; newpw.required = recovery;
    email.disabled = recovery; btn.textContent = recovery ? 'Set new password' : 'Sign in';
  }
  var pending = null;
  try { pending = sessionStorage.getItem('tmlcalc.sb.msg'); sessionStorage.removeItem('tmlcalc.sb.msg'); } catch (e) {}
  if (pending) say(pending, true);

  sb.auth.onAuthStateChange(function (ev, session) {
    if (ev === 'PASSWORD_RECOVERY') { if (session && session.user) email.value = session.user.email || ''; setMode('recovery'); say('Choose a new password.'); }
  });
  sb.auth.getSession().then(function (r) {
    var s = r.data && r.data.session;
    if (s && !/type=recovery/.test(location.hash)) loadApp();
  });

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    btn.disabled = true;
    if (mode === 'recovery') {
      say('Saving the new password…');
      var u = await sb.auth.updateUser({ password: newpw.value });
      if (u.error) { say(u.error.message, true); btn.disabled = false; return; }
      history.replaceState(null, '', location.pathname);
      setMode('signin'); await loadApp(); return;
    }
    say('Signing in…');
    var r = await sb.auth.signInWithPassword({ email: email.value.trim().toLowerCase(), password: password.value });
    if (r.error) { say(/invalid/i.test(r.error.message) ? 'Email or password is not right.' : r.error.message, true); btn.disabled = false; return; }
    await loadApp();
  });
  forgot.addEventListener('click', async function (ev) {
    ev.preventDefault();
    var em = email.value.trim().toLowerCase();
    if (!em) { say('Type your email first, then click "Forgot password".', true); email.focus(); return; }
    var r = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    say(r.error ? r.error.message : 'If that address has an account, a reset link is on its way. Open it on this device.', !!r.error);
  });
})();
